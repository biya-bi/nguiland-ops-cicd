apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: ingress-ip-discoverer
  namespace: cicd
spec:
  providerRef:
    name: git-event-listener
  inclusionList:
    - "^stored artifact for commit '.*'$"
  eventSeverity: info
  eventMetadata:
    eventListenerAddress: http://el-helm-publish.cicd.svc.cluster.local:8080
    pipelineName: helm-publish
    pipelineNamespace: cicd
    chartContext: addons/ingress-ip-discoverer
    repoPath: charts/nguiland
  eventSources:
    - kind: GitRepository
      name: ingress-ip-discoverer
