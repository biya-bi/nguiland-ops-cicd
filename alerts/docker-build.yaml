apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: docker-build
  namespace: cicd
spec:
  providerRef:
    name: git-event-listener
  inclusionList:
    - "^stored artifact for commit '.*'$"
  eventSeverity: info
  eventMetadata:
    eventListenerAddress: http://el-docker-build.cicd.svc.cluster.local:8080/
    pipelineName: docker-build
    contextDir: .
  eventSources:
    - kind: GitRepository
      name: nguiland-ops-docker
